<style>

body{

  background:#f5f3ff;

}

button,input,select,textarea{

}

button{

  border:0;
}

.hidden{

}

/* LOADING */
#loadingScreen{
  position:fixed;
  inset:0;
  z-index:99999;
  background:linear-gradient(135deg,#5b21b6,#7c3aed);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

.loadingBox{
  text-align:center;
}

.loadingLogo{
  width:80px;
  height:80px;
  border-radius:24px;
  background:rgba(255,255,255,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:900;
  margin:auto auto 18px;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.spinner{
  width:34px;
  height:34px;
  border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:20px auto 0;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

  align-items:center;
  justify-content:center;

.dangerBtn{

.smallText{

.rememberRow{

.rememberRow label{

.linkBtn{

.brandText b{

.brandText span{

.adminTopBtn{

  font-weight:800;

.balance{

.navIcon{

  font-size:19px;

.navBtn.active{

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(18,12,31,.55);
  padding:10px;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:620px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:23px 23px 15px 15px;
  padding:18px;
  animation:up .18s ease;
}

@keyframes up{
  from{transform:translateY(30px);opacity:.5}
  to{transform:translateY(0);opacity:1}
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.closeBtn{
  width:35px;
  height:35px;
  border-radius:10px;
  background:#f2eff8;
  color:#514a61;
}

/* TOAST */
#toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%) translateY(20px);
  z-index:10000;
  background:#171329;
  color:white;
  padding:11px 15px;
  border-radius:12px;
  font-size:12px;
  max-width:90%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* DESKTOP */
@media(min-width:700px){

  .modal{

  }

  .modalBox{

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(value){
  const n = Number(value || 0);
  return "৳" + n.toFixed(2);
}

function isAdmin(){
  return currentUser && ADMIN_UIDS.includes(currentUser.uid);

function toast(message){
  const el = $("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },3000);
}

function showModal(html){
  $("modalBox").innerHTML = html;
  $("modal").classList.add("show");
}

function closeModal(){
  $("modal").classList.remove("show");
}

function modalOutside(e){
  if(e.target.id==="modal"){
    closeModal();
  }
}

function safeUrl(url){
  if(!url) return "";
  try{
    const u = new URL(url);
    if(u.protocol==="http:" || u.protocol==="https:"){
      return u.href;
    }
  }catch(e){}
  return "";
}

/* =========================================================
   AUTH REQUEST PROTECTION
========================================================= */

const AUTH_GUARD_KEY = "view_eran_auth_guard_v2";

let authGuard = {
  loginFails:0,
  signupFails:0,
  loginLockedUntil:0,
  signupLockedUntil:0
};

try{
  const saved = localStorage.getItem(AUTH_GUARD_KEY);

  if(saved){
    authGuard = {
      ...authGuard,
      ...JSON.parse(saved)
    };
  }
}catch(e){}

function saveAuthGuard(){
  try{
    localStorage.setItem(
      AUTH_GUARD_KEY,
      JSON.stringify(authGuard)
    );
  }catch(e){}
}

function authLocked(type){

  const key =
    type==="signup"
      ? "signupLockedUntil"
      : "loginLockedUntil";

  const until = Number(authGuard[key] || 0);

  if(Date.now() < until){

    const seconds =
      Math.ceil((until-Date.now())/1000);

    toast(
      "নিরাপত্তার কারণে সাময়িকভাবে বন্ধ আছে। "+
      seconds+" সেকেন্ড পরে আবার চেষ্টা করুন।"
    );

    return true;
  }

  return false;
}

function lockAuth(type,seconds){

  const key =
    type==="signup"
      ? "signupLockedUntil"
      : "loginLockedUntil";

  authGuard[key] = Date.now() + seconds*1000;

  saveAuthGuard();

  toast(
    "অনেকবার ভুল চেষ্টা হয়েছে। "+
    seconds+" সেকেন্ড অপেক্ষা করুন।"
  );
}

function registerAuthFail(type){

  if(type==="login"){
    authGuard.loginFails++;

    if(authGuard.loginFails>=7){
      lockAuth("login",300);
    }
    else if(authGuard.loginFails>=5){
      lockAuth("login",120);
    }
    else if(authGuard.loginFails>=3){
      lockAuth("login",30);
    }
  }

  if(type==="signup"){
    authGuard.signupFails++;

    if(authGuard.signupFails>=7){
      lockAuth("signup",300);
    }
    else if(authGuard.signupFails>=5){
      lockAuth("signup",120);
    }
    else if(authGuard.signupFails>=3){
      lockAuth("signup",30);
    }
  }

  saveAuthGuard();
}

function resetAuthFail(type){

  if(type==="login"){
    authGuard.loginFails=0;
    authGuard.loginLockedUntil=0;
  }

  if(type==="signup"){
    authGuard.signupFails=0;
    authGuard.signupLockedUntil=0;
  }

  saveAuthGuard();
}

function authErrorMessage(e){

  if(e.code==="auth/too-many-requests"){
    return "Firebase নিরাপত্তার কারণে অনেক request বন্ধ করেছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
  }

  if(e.code==="auth/email-already-in-use"){
    return "এই Email দিয়ে আগে থেকেই Account আছে। Login করুন।";
  }

  if(e.code==="auth/invalid-email"){
    return "সঠিক Email দিন।";
  }

  if(e.code==="auth/weak-password"){
    return "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";
  }

  if(
    e.code==="auth/invalid-credential" ||
    e.code==="auth/wrong-password" ||
    e.code==="auth/user-not-found"
  ){
    return "Email অথবা Password সঠিক নয়।";
  }

  if(e.code==="auth/user-disabled"){
    return "এই Account বন্ধ করা হয়েছে।";
  }

  if(e.code==="auth/network-request-failed"){
    return "Internet connection সমস্যা হয়েছে।";
  }

  return e.message || "একটি সমস্যা হয়েছে।";
}

/* =========================================================
   LOGIN
========================================================= */

async function login(){

  if(authBusy) return;

  if(authLocked("login")) return;

  const email = $("loginEmail").value.trim();
  const pass = $("loginPass").value;

  if(!email || !pass){
    toast("Email এবং Password দিন");
    return;
  }

  authBusy=true;

  const btn=$("loginBtn");

  btn.disabled=true;
  btn.textContent="Logging in...";

  try{

    await auth.signInWithEmailAndPassword(
      email,
      pass
    );

    resetAuthFail("login");

    toast("Login সফল হয়েছে");

  }catch(e){

    if(
      e.code==="auth/invalid-credential" ||
      e.code==="auth/wrong-password" ||
      e.code==="auth/user-not-found"
    ){
      registerAuthFail("login");
    }

    toast(authErrorMessage(e));

  }finally{

    authBusy=false;

    btn.disabled=false;
    btn.textContent="Login";
  }
}

/* =========================================================
   SIGNUP
========================================================= */

async function signup(){

  if(authBusy) return;

  if(authLocked("signup")) return;

  const name = $("signupName").value.trim();
  const email = $("signupEmail").value.trim();
  const ref = $("signupRef").value.trim();
  const pass = $("signupPass").value;
  const pass2 = $("signupPass2").value;

  if(!name || !email || !pass){
    toast("সব তথ্য পূরণ করুন");
    return;
  }

  if(pass.length<6){
    toast("Password কমপক্ষে ৬ অক্ষরের হতে হবে");
    return;
  }

  if(pass!==pass2){
    toast("Password মিলছে না");
    return;
  }

  authBusy=true;

  const btn=$("signupBtn");

  btn.disabled=true;
  btn.textContent="Creating...";

  try{

    const cred =
      await auth.createUserWithEmailAndPassword(
        email,
        pass
      );

    const uid=cred.user.uid;

    await db.collection("users")
      .doc(uid)
      .set({

        uid:uid,
        name:name,
        email:email,
        referredBy:ref,
        balance:0,
        totalEarn:0,
        todayEarn:0,
        active:false,
        referralCode:uid.substring(0,8),
        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()
      });

    resetAuthFail("signup");

    toast("Account তৈরি হয়েছে");

  }catch(e){

    if(e.code==="auth/too-many-requests"){
      registerAuthFail("signup");
    }

    toast(authErrorMessage(e));

  }finally{

    authBusy=false;

    btn.disabled=false;
    btn.textContent="Create Account";
  }
}

async function loadUser(){

  const ref=db.collection("users").doc(currentUser.uid);

  const snap=await ref.get();

  if(snap.exists){

    currentUserData=snap.data();

  }else{

    currentUserData={
      uid:currentUser.uid,
      name:currentUser.displayName || "User",
      email:currentUser.email || "",
      referredBy:"",
      balance:0,
      totalEarn:0,
      todayEarn:0,
      active:false,
      referralCode:currentUser.uid.substring(0,8)
    };

    await ref.set({
      ...currentUserData,
      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()
    });
  }
}

async function submitWithdrawal(){

  const method=$("withdrawMethod").value;
  const number=$("withdrawNumber").value.trim();
  const amount=Number($("withdrawAmount").value);

  const balance=Number(currentUserData?.balance || 0);
  const fee=Number(appConfig.withdrawalFee || 0);

  if(!number){
    toast("Payment number দিন");

  }

  if(!amount || amount<100){
    toast("Minimum withdrawal ৳100");
    return;
  }

  if(amount+fee>balance){
    toast("আপনার balance যথেষ্ট নয়");
    return;
  }

  try{

    await db.collection("withdrawals").add({

      uid:currentUser.uid,
      email:currentUser.email || "",
      name:currentUserData?.name || "",
      method:method,
      number:number,
      amount:amount,
      fee:fee,
      status:"pending",
      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

    toast("Withdrawal request পাঠানো হয়েছে");

    $("withdrawNumber").value="";
    $("withdrawAmount").value="";

    loadMyWithdrawals();

  }catch(e){

    toast("Withdrawal request পাঠানো যায়নি");
  }
}

/* =========================================================
   MY WITHDRAWALS
========================================================= */

async function loadMyWithdrawals(){

  if(!currentUser || !$("withdrawHistory")) return;

  try{

    const snap=
      await db.collection("withdrawals")
      .where("uid","==",currentUser.uid)
      .get();

    let arr=[];

    snap.forEach(doc=>{
      arr.push({
        id:doc.id,
        ...doc.data()
      });
    });

    arr.sort((a,b)=>{

      const aTime=a.createdAt?.seconds || 0;
      const bTime=b.createdAt?.seconds || 0;

      return bTime-aTime;
    });

    if(!arr.length){

      $("withdrawHistory").innerHTML=
        `<div class="card empty">কোনো withdrawal request নেই।</div>`;

      return;
    }

    $("withdrawHistory").innerHTML=
      arr.map(withdrawalItem).join("");

  }catch(e){

    console.error(e);

    $("withdrawHistory").innerHTML=
      `<div class="card empty">History load করা যায়নি।</div>`;
  }
}

function withdrawalItem(x){

  const status=x.status || "pending";

  let cls="";

  if(status==="approved") cls="green";
  if(status==="rejected") cls="red";

  return `
    <div class="listItem">

      <div class="listTop">

        <div>
          <h3>${escapeHtml(x.method || "")}</h3>
          <p>
            ${escapeHtml(x.number || "")}<br>
            Amount: ${money(x.amount)}<br>
            Fee: ${money(x.fee)}
          </p>
        </div>

        <span class="badge ${cls}">
          ${escapeHtml(status.toUpperCase())}
        </span>

      </div>

    </div>
  `;
}

/* =========================================================
   CHANGE BALANCE
========================================================= */

async function changeUserBalance(uid){

  const action=$("balanceAction").value;
  const amount=Number($("balanceAmount").value);

  if(!Number.isFinite(amount) || amount<0){
    toast("সঠিক amount দিন");
    return;
  }

  try{

    const ref=db.collection("users").doc(uid);

    const snap=await ref.get();

    if(!snap.exists){
      toast("User পাওয়া যায়নি");
      return;
    }

    const data=snap.data();

    const current=Number(data.balance || 0);

    let next=current;

    if(action==="add"){
      next=current+amount;
    }

    if(action==="subtract"){
      next=Math.max(0,current-amount);
    }

    if(action==="set"){
      next=amount;
    }

    await ref.update({
      balance:next
    });

    closeModal();

    toast("Balance updated");

    renderAdminUsers();

  }catch(e){

    console.error(e);

    toast("Balance update করা যায়নি");
  }
}

    if(!activationRequests.length){

        `<div class="card empty">

    const snap=await ref.get();

    if(!snap.exists){
      toast("Request পাওয়া যায়নি");
      return;
    }

    const data=snap.data();

    if(data.status!=="pending"){
      toast("এই request already processed");
      return;
    }

    const userRef=
      db.collection("users").doc(data.uid);

    const userSnap=await userRef.get();

    if(!userSnap.exists){
      toast("User পাওয়া যায়নি");
      return;
    }

    const user=userSnap.data();

    const currentBalance=
      Number(user.balance || 0);

    const bonus=
      Number(appConfig.activationBonus || 0);

    await userRef.update({

      active:true,

      balance:
        currentBalance+bonus,

      totalEarn:
        Number(user.totalEarn || 0)+bonus

    });

    await ref.update({
      status:"approved",
      approvedAt:
        firebase.firestore.FieldValue.serverTimestamp(),
      approvedBy:currentUser.uid
    });

    toast("Activation approved");

    renderAdminActivation();

  }catch(e){

    console.error(e);

    toast("Approve করা যায়নি");
  }
}

/* =========================================================
   ADMIN WITHDRAW
========================================================= */

async function renderAdminWithdraw(){

  const box=$("adminContent");

  box.innerHTML=`
    <div class="card empty">
      Loading withdrawal requests...
    </div>
  `;

  try{

    const snap=
      await db.collection("withdrawals")
      .where("status","==","pending")
      .get();

    withdrawalRequests=[];

    snap.forEach(doc=>{
      withdrawalRequests.push({
        id:doc.id,
        ...doc.data()
      });
    });

    withdrawalRequests.sort((a,b)=>
      (b.createdAt?.seconds || 0)-
      (a.createdAt?.seconds || 0)
    );

    if(!withdrawalRequests.length){

      box.innerHTML=
        `<div class="card empty">
          কোনো pending withdrawal নেই।
        </div>`;

      return;
    }

    box.innerHTML=
      withdrawalRequests
      .map(withdrawAdminItem)
      .join("");

  }catch(e){

    console.error(e);

    box.innerHTML=
      `<div class="card empty">
        Withdrawal requests load করা যায়নি।
      </div>`;
  }
}

/* =========================================================
   APPROVE WITHDRAWAL
========================================================= */

async function approveWithdrawal(id){

  try{

    const ref=
      db.collection("withdrawals").doc(id);

    const snap=await ref.get();

    if(!snap.exists){
      toast("Request পাওয়া যায়নি");
      return;
    }

    const data=snap.data();

    if(data.status!=="pending"){
      toast("Already processed");
      return;
    }

    const userRef=
      db.collection("users").doc(data.uid);

    const userSnap=await userRef.get();

    if(!userSnap.exists){
      toast("User পাওয়া যায়নি");
      return;
    }

    const user=userSnap.data();

    const balance=
      Number(user.balance || 0);

    const amount=
      Number(data.amount || 0);

    const fee=
      Number(data.fee || 0);

    if(amount+fee>balance){

      await ref.update({
        status:"rejected",
        rejectedReason:"Insufficient balance",
        rejectedAt:
          firebase.firestore.FieldValue.serverTimestamp()
      });

      toast("Balance যথেষ্ট না থাকায় rejected");

      renderAdminWithdraw();

      return;
    }

    await userRef.update({

      balance:
        balance-amount-fee

    });

    await ref.update({

      status:"approved",

      approvedAt:
        firebase.firestore.FieldValue.serverTimestamp(),

      approvedBy:currentUser.uid

    });

    toast("Withdrawal approved");

    renderAdminWithdraw();

  }catch(e){

    console.error(e);

    toast("Approve করা যায়নি");
  }
}

/* =========================================================
   SAVE PROJECT
========================================================= */

async function saveProject(oldId=""){

  const id=$("projectId").value.trim();
  const title=$("projectTitle").value.trim();
  const subtitle=$("projectSubtitle").value.trim();
  const logo=$("projectLogo").value.trim();
  const link=$("projectLink").value.trim();
  const amount=Number($("projectAmount").value);

  if(!id || !title){
    toast("Project ID এবং Title দিন");
    return;
  }

  const project={
    id:id,
    title:title,
    subtitle:subtitle,
    logo:logo,
    link:link,
    amount:Number.isFinite(amount) ? amount : 0,
    active:true
  };

  if(oldId){

    const index=
      projects.findIndex(x=>x.id===oldId);

    if(index!==-1){

      project.active=
        projects[index].active!==false;

      projects[index]=project;

    }

  }else{

    if(projects.some(x=>x.id===id)){
      toast("এই Project ID আগে থেকেই আছে");
      return;
    }

    projects.push(project);
  }

  await saveProjects();

  closeModal();

  toast("Project saved");

  renderAdminProjects();
}

/* =========================================================
   SAVE PROJECTS FIRESTORE
========================================================= */

async function saveProjects(){

  await db.collection("appData")
    .doc("projects")
    .set({
      items:projects,
      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp()
    });
}

/* =========================================================
   TOGGLE PROJECT
========================================================= */

async function toggleProject(id){

  const p=projects.find(x=>x.id===id);

  if(!p) return;

  p.active=p.active===false;

  try{

    await saveProjects();

    toast(
      p.active
      ? "Project enabled"
      : "Project disabled"
    );

    renderAdminProjects();

  }catch(e){

    console.error(e);

    toast("Project update করা যায়নি");
  }
}

/* =========================================================
   DELETE PROJECT
========================================================= */

async function deleteProject(id){

  const p=projects.find(x=>x.id===id);

  if(!p) return;

  const ok=
    confirm("এই Project delete করতে চান?");

  if(!ok) return;

  projects=
    projects.filter(x=>x.id!==id);

  try{

    await saveProjects();

    toast("Project deleted");

    renderAdminProjects();

  }catch(e){

    console.error(e);

    toast("Delete করা যায়নি");
  }
}

      Number($("setActivationFee").value || 0),

    activationBonus:
      Number($("setActivationBonus").value || 0),

    withdrawalFee:
      Number($("setWithdrawalFee").value || 0),

    bkash:
      $("setBkash").value.trim(),

    nagad:
      $("setNagad").value.trim(),

    telegram:
      $("setTelegram").value.trim(),

    support1:
      $("setSupport1").value.trim(),

    support2:
      $("setSupport2").value.trim(),

    notice:
      $("setNotice").value.trim()
  };

  try{

    await db.collection("appData")
      .doc("config")
      .set({
        ...next,
        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()
      });

    appConfig={
      ...DEFAULT_CONFIG,

    };

}
