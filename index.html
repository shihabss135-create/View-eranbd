========================= */

const $=id=>document.getElementById(id);

function money(n){
return "৳"+Number(n||0).toFixed(2);
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function toast(msg){
$("toast").textContent=msg;
$("toast").classList.remove("hide");
setTimeout(()=>$("toast").classList.add("hide"),2500);
}

function openModal(title,body){
$("modalTitle").textContent=title;
$("modalBody").innerHTML=body;
$("modal").classList.remove("hide");
}

function closeModal(){
$("modal").classList.add("hide");
}

function isAdmin(){
return !!me && ADM.includes(me.uid);
}

function dateText(v){
try{
if(!v)return "";
if(v.toDate)return v.toDate().toLocaleString("bn-BD");
return new Date(v).toLocaleString("bn-BD");
}catch(e){return ""}
}

/* =========================
   AUTH UI
========================= */

function showAuth(type){
if(type==="login"){
$("loginForm").classList.remove("hide");
$("signupForm").classList.add("hide");
$("loginTab").classList.add("active");
$("signupTab").classList.remove("active");
}else{
$("loginForm").classList.add("hide");
$("signupForm").classList.remove("hide");
$("loginTab").classList.remove("active");
$("signupTab").classList.add("active");
}
}

async function signup(){

const name=$("signupName").value.trim();
const email=$("signupEmail").value.trim();
const ref=$("signupRef").value.trim();
const pass=$("signupPass").value;
const pass2=$("signupPass2").value;

if(!name||!email||!pass){
toast("সব তথ্য পূরণ করুন");
return;
}

if(pass.length<6){
toast("Password কমপক্ষে 6 অক্ষরের হতে হবে");
return;
}

if(pass!==pass2){
toast("Password মিলছে না");
return;
}

try{

const cred=await auth.createUserWithEmailAndPassword(email,pass);

const uid=cred.user.uid;

await db.collection("users").doc(uid).set({
uid,
name,
email,
referredBy:ref,
balance:0,
totalEarn:0,
todayEarn:0,
active:false,
referralCode:uid.substring(0,8),
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});

toast("Account তৈরি হয়েছে");

}catch(e){
toast(e.message);
}

}

async function login(){

const email=$("loginEmail").value.trim();
const pass=$("loginPass").value;

if(!email||!pass){
toast("Email এবং Password দিন");
return;
}

try{
await auth.signInWithEmailAndPassword(email,pass);
}catch(e){
toast(e.message);
}

}

async function forgot(){

const email=$("loginEmail").value.trim();

if(!email){
toast("আগে Email লিখুন");
return;
}

try{
await auth.sendPasswordResetEmail(email);
toast("Password reset link Email-এ পাঠানো হয়েছে");
}catch(e){
toast(e.message);
}

}

/* =========================
   AUTH STATE
========================= */

auth.onAuthStateChanged(async user=>{

if(!user){

me=null;
userData=null;

$("loading").classList.add("hide");
$("app").classList.add("hide");
$("auth").classList.remove("hide");

return;
}

try{

me=user;

const configSnap=await db.collection("appData").doc("config").get();

if(configSnap.exists){
cfg={...DEFAULT_CFG,...configSnap.data()};
}else{
cfg={...DEFAULT_CFG};
}

const projectSnap=await db.collection("appData").doc("projects").get();

if(projectSnap.exists && Array.isArray(projectSnap.data().items)){
projects=projectSnap.data().items;
}else{
projects=[...DEFAULT_PROJECTS];
}

const userSnap=await db.collection("users").doc(user.uid).get();

if(userSnap.exists){
userData=userSnap.data();
}else{

userData={
uid:user.uid,
name:user.displayName||"User",
email:user.email||"",
referredBy:"",
balance:0,
totalEarn:0,
todayEarn:0,
active:false,
referralCode:user.uid.substring(0,8),
createdAt:firebase.firestore.FieldValue.serverTimestamp()
};

await db.collection("users").doc(user.uid).set(userData);
}

$("loading").classList.add("hide");
$("auth").classList.add("hide");
$("app").classList.remove("hide");

$("ab").classList.toggle("hide",!isAdmin());

page("home");

}catch(e){

function page(p){

document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));

const map={
home:"navHome",
wallet:"navWallet",
team:"navTeam",
profile:"navProfile",
help:"navHelp"
};

if($(map[p]))$(map[p]).classList.add("active");

if(p==="home")renderHome();
if(p==="wallet")renderWallet();
if(p==="team")renderTeam();
if(p==="profile")renderProfile();
if(p==="help")renderHelp();

}

async function submitWithdraw(){

const method=$("wdMethod").value;
const number=$("wdNumber").value.trim();
const amount=Number($("wdAmount").value);

if(!number||!amount){
toast("সব তথ্য দিন");
return;
}

if(amount<100){
toast("Minimum withdrawal ৳100");
return;
}

const total=amount+Number(cfg.withdrawalFee||0);

if(Number(userData.balance||0)<total){
toast("আপনার balance যথেষ্ট নয়");
return;
}

try{

await db.collection("withdrawals").add({
uid:me.uid,
name:userData.name||"",
email:userData.email||me.email||"",
method,
number,
amount,
fee:Number(cfg.withdrawalFee||0),
status:"pending",
balanceDeducted:false,
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});

toast("Withdrawal Request পাঠানো হয়েছে");

$("wdNumber").value="";
$("wdAmount").value="";

loadWithdrawHistory();

}catch(e){
toast(e.message);
}

}

async function loadWithdrawHistory(){

const box=$("withdrawHistory");

if(!box)return;

try{

const snap=await db.collection("withdrawals")
.where("uid","==",me.uid)
.limit(30)
.get();

if(snap.empty){
box.innerHTML=`<div class="empty">কোনো Withdrawal নেই</div>`;
return;
}

let arr=[];

snap.forEach(doc=>{
arr.push({id:doc.id,...doc.data()});
});

arr.sort((a,b)=>{
const aa=a.createdAt?.toMillis?a.createdAt.toMillis():0;
const bb=b.createdAt?.toMillis?b.createdAt.toMillis():0;
return bb-aa;
});

box.innerHTML=arr.map(x=>`
<div class="adminItem">
<strong>${money(x.amount)}</strong>
<div class="small">
${esc(x.method)} • ${esc(x.number)}<br>
Fee: ${money(x.fee)}<br>
Status: <b>${esc(x.status)}</b><br>
${dateText(x.createdAt)}
</div>
</div>
`).join("");

}catch(e){
box.innerHTML=`<div class="small">${esc(e.message)}</div>`;
}

}

async function changeBalance(uid){

const amount=Number($("balAmount").value);
const action=$("balAction").value;

if(amount<0||Number.isNaN(amount)){
toast("সঠিক Amount দিন");
return;
}

try{

await db.runTransaction(async transaction=>{

const ref=db.collection("users").doc(uid);
const snap=await transaction.get(ref);

if(!snap.exists)throw new Error("User not found");

const old=Number(snap.data().balance||0);

let next=old;

if(action==="add")next=old+amount;
if(action==="subtract")next=Math.max(0,old-amount);
if(action==="set")next=amount;

transaction.update(ref,{
balance:next
});

});

toast("Balance Updated");

closeModal();
openAdmin();

}catch(e){
toast(e.message);
}

}

async function approveActivation(id,uid){

if(!isAdmin())return;

try{

await db.runTransaction(async transaction=>{

const actRef=db.collection("activations").doc(id);
const userRef=db.collection("users").doc(uid);

const actSnap=await transaction.get(actRef);
const userSnap=await transaction.get(userRef);

if(!actSnap.exists)throw new Error("Activation not found");
if(!userSnap.exists)throw new Error("User not found");

const a=actSnap.data();
const u=userSnap.data();

if(a.status!=="pending"){
throw new Error("এই request already processed");
}

let newBalance=Number(u.balance||0);

if(!a.bonusCredited){
newBalance+=Number(cfg.activationBonus||0);
}

transaction.update(userRef,{
active:true,
balance:newBalance
});

transaction.update(actRef,{
status:"approved",
bonusCredited:true,
approvedBy:me.uid,
approvedAt:firebase.firestore.FieldValue.serverTimestamp()
});

});

toast("Activation Approved");

adminActivations();

}catch(e){
toast(e.message);
}

}

async function rejectActivation(id){

if(!isAdmin())return;

try{

await db.collection("activations").doc(id).update({
status:"rejected",
rejectedBy:me.uid,
rejectedAt:firebase.firestore.FieldValue.serverTimestamp()
});

toast("Activation Rejected");

adminActivations();

}catch(e){
toast(e.message);
}

}

const aa=a.createdAt?.toMillis?a.createdAt.toMillis():0;
const bb=b.createdAt?.toMillis?b.createdAt.toMillis():0;
return bb-aa;
});

box.innerHTML=arr.map(x=>`

<div class="adminItem">

<strong>${esc(x.name||"User")}</strong>

<div class="small">
Email: ${esc(x.email||"")}<br>
UID: ${esc(x.uid||"")}<br>
Method: ${esc(x.method||"")}<br>
Number: ${esc(x.number||"")}<br>
Amount: ${money(x.amount)}<br>
Fee: ${money(x.fee)}<br>
Total: <b>${money(Number(x.amount||0)+Number(x.fee||0))}</b><br>
Date: ${dateText(x.createdAt)}
</div>

<br>

<div class="row">

<button class="action green"
onclick="approveWithdrawal('${x.id}','${esc(x.uid||"")}')">
Approve
</button>

<button class="action red"
onclick="rejectWithdrawal('${x.id}')">
Reject
</button>

</div>

</div>

`).join("");

}catch(e){
box.innerHTML=`<div class="small">${esc(e.message)}</div>`;
}

}

async function approveWithdrawal(id,uid){

if(!isAdmin())return;

try{

await db.runTransaction(async transaction=>{

const wdRef=db.collection("withdrawals").doc(id);
const userRef=db.collection("users").doc(uid);

const wdSnap=await transaction.get(wdRef);
const userSnap=await transaction.get(userRef);

if(!wdSnap.exists)throw new Error("Withdrawal not found");
if(!userSnap.exists)throw new Error("User not found");

const w=wdSnap.data();
const u=userSnap.data();

if(w.status!=="pending"){
throw new Error("এই request already processed");
}

let balance=Number(u.balance||0);

const total=
Number(w.amount||0)+
Number(w.fee||0);

if(balance<total){
throw new Error("User balance এখন যথেষ্ট নয়");
}

if(!w.balanceDeducted){

balance-=total;

transaction.update(userRef,{
balance
});

}

transaction.update(wdRef,{
status:"approved",
balanceDeducted:true,
approvedBy:me.uid,
approvedAt:firebase.firestore.FieldValue.serverTimestamp()
});

});

toast("Withdrawal Approved");

adminWithdrawals();

}catch(e){
toast(e.message);
}

}

async function rejectWithdrawal(id){

if(!isAdmin())return;

try{

await db.collection("withdrawals").doc(id).update({
status:"rejected",
rejectedBy:me.uid,
rejectedAt:firebase.firestore.FieldValue.serverTimestamp()
});

toast("Withdrawal Rejected");

adminWithdrawals();

}catch(e){
toast(e.message);
}

}

openModal("Edit Project",`

</div>

<div class="field">

</div>

</div>

<div class="field">
<label>Task Link</label>

</div>

<div class="field">
<label>Reward Amount</label>

</div>

<div class="field">
<label>Status</label>
<select id="pActive">

<option value="false" ${p.active===false?"selected":""}>OFF</option>
</select>
</div>

</button>

`);

}

async function saveProject(i){

projects[i]={
...projects[i],
title:$("pTitle").value.trim(),
subtitle:$("pSubtitle").value.trim(),
logo:$("pLogo").value.trim(),
link:$("pLink").value.trim(),
amount:Number($("pAmount").value||0),
active:$("pActive").value==="true"
};

await saveProjects();

toast("Project Updated");

closeModal();
openAdmin();

}

openModal("Add Project",`

</div>

<div class="field">
<label>Subtitle</label>
<input id="pSubtitle" placeholder="Project description">
</div>

<div class="field">
<label>Logo / Emoji</label>
<input id="pLogo" value="⭐">
</div>

<div class="field">
<label>Task Link</label>
<input id="pLink" placeholder="https://...">
</div>

<div class="field">
<label>Reward Amount</label>
<input id="pAmount" type="number" value="0">
</div>

<button class="mainBtn" onclick="addProject()">
Add Project
</button>

`);

}

async function addProject(){

const title=$("pTitle").value.trim();

if(!title){
toast("Title দিন");
return;
}

const id=
"p_"+Date.now()+"_"+Math.random().toString(36).substring(2,7);

projects.push({
id,
title,
subtitle:$("pSubtitle").value.trim(),
logo:$("pLogo").value.trim()||"⭐",
link:$("pLink").value.trim(),
amount:Number($("pAmount").value||0),
active:true
});

await saveProjects();

toast("Project Added");

closeModal();
openAdmin();

}

async function toggleProject(i){

projects[i].active=projects[i].active===false;

await saveProjects();

toast("Project Status Updated");

renderAdminProjects();

}

async function deleteProject(i){

if(!confirm("এই Project Delete করবেন?"))return;

projects.splice(i,1);

await saveProjects();

toast("Project Deleted");

renderAdminProjects();

}

async function saveProjects(){

await db.collection("appData").doc("projects").set({
items:projects,
updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
updatedBy:me.uid
});

}
