.bal{

.modal{

/* ==========================================
   HELPERS
========================================== */

const $=id=>document.getElementById(id);

const money=x=>"৳"+Number(x||0).toFixed(2);

const esc=x=>String(x??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

function msg(x){
$("msg").textContent=x;
}


/* ==========================================
   AUTH TAB
========================================== */

function authTab(x){

$("lf").classList.toggle("hide",x!=="l");

$("sf").classList.toggle("hide",x!=="s");

$("lt").classList.toggle("on",x==="l");

$("st").classList.toggle("on",x==="s");

msg("");

}


/* ==========================================
   LOGIN
========================================== */

async function login(){

msg("Login হচ্ছে...");

try{

await auth.signInWithEmailAndPassword(
$("le").value.trim(),
$("lp").value
);

msg("");

}catch(e){

console.error(e);

msg(e.message);

}

}


/* ==========================================
   SIGN UP
========================================== */

async function signup(){

let n=$("sn").value.trim();

let e=$("se").value.trim();

let r=$("sr").value.trim();

let p=$("sp").value;

let p2=$("sp2").value;


if(!n||!e||!p){

msg("সব প্রয়োজনীয় তথ্য পূরণ করুন।");

return;

}

if(p!==p2){

msg("দুইটি Password একই হতে হবে।");

return;

}

if(p.length<6){

msg("Password কমপক্ষে 6 অক্ষরের হতে হবে।");

return;

}


msg("Account তৈরি হচ্ছে...");


try{

let c=await auth.createUserWithEmailAndPassword(e,p);

await db.collection("users")
.doc(c.user.uid)
.set({

uid:c.user.uid,

name:n,

email:e,

referredBy:r,

balance:0,

totalEarn:0,

todayEarn:0,

active:false,

referralCode:c.user.uid
.slice(0,8)
.toUpperCase(),

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

msg("");

}catch(e){

console.error(e);

msg(e.message);

}

}


/* ==========================================
   FORGOT PASSWORD
========================================== */

async function forgot(){

let e=$("le").value.trim();

if(!e){

msg("আগে Email দিন।");

return;

}

try{

await auth.sendPasswordResetEmail(e);

alert("Password reset link আপনার Email-এ পাঠানো হয়েছে।");

}catch(e){

msg(e.message);

}

}


/* ==========================================
   AUTH STATE
========================================== */

auth.onAuthStateChanged(async u=>{

$("loading").style.display="none";


if(!u){

$("auth").classList.remove("hide");

$("app").classList.add("hide");

return;

}


me=u;

$("auth").classList.add("hide");

$("app").classList.remove("hide");


try{

let c=await db
.collection("appData")
.doc("config")
.get();

if(c.exists){

cfg={
...cfg,
...c.data()
};

}


let s=await db
.collection("users")
.doc(u.uid)
.get();


if(s.exists){

ud=s.data();

}else{

ud={

uid:u.uid,

name:u.email,

email:u.email,

balance:0,

totalEarn:0,

todayEarn:0,

active:false,

referralCode:u.uid
.slice(0,8)
.toUpperCase()

};

await db.collection("users")
.doc(u.uid)
.set(ud);

}

}catch(e){

console.error(e);

}


$("ab").classList.toggle(
"hide",
!ADM.includes(me.uid)
);


go("home");

});


/* ==========================================
   NAVIGATION
========================================== */

function go(p){

document
.querySelectorAll(".nav")
.forEach(x=>x.classList.remove("on"));


if(p==="home"){

$("nh").classList.add("on");

home();

}

if(p==="wallet"){

$("nw").classList.add("on");

wallet();

}

if(p==="team"){

$("nt").classList.add("on");

team();

}

if(p==="profile"){

$("np").classList.add("on");

profile();

}

if(p==="help"){

$("nx").classList.add("on");

help();

}

}

   HOME
========================================== */

<div class="hero">

<h2>
${esc(ud.name||"User")}
</h2>

<div class="bal">
${money(ud.balance)}
</div>

${ud.active?"● Active":"● Inactive"}

</div>


${
ud.active

fee প্রযোজ্য।

}


<div class="card notice">

📢 Notice
</b>

<p>

</p>

`

</div>


<h3>
Our Projects

<div class="grid">

${
P.map(p=>`

class="card project"
onclick="project('${p[0]}','${p[1]}')">

<div class="icon">

p[2].startsWith("http")

}

</div>

<b>
${p[1]}
</b>

</div>

/* ==========================================
   SEND ACTIVATION
========================================== */

async function sendAct(){

let s=$("as").value.trim();

let t=$("at").value.trim();


if(!s||!t){

alert("Sender Number এবং Transaction ID দিন।");

return;

}


try{

await db.collection("activations").add({

uid:me.uid,

name:ud.name,

email:me.email,

amount:Number(cfg.activationFee),

method:$("am").value,

sender:s,

trx:t,

status:"pending",

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

closeM();

alert(
"Activation request পাঠানো হয়েছে। Admin verify করে Active করবে।"
);

}catch(e){

alert(e.message);

}

}

/* ==========================================
   WITHDRAW
========================================== */

async function wd(){

let a=Number($("wa").value);

let n=$("wn").value.trim();

let fee=Number(cfg.withdrawalFee);


if(!n||a<100){

alert("সঠিক Number এবং Amount দিন।");

return;

}


if(a+fee>Number(ud.balance||0)){

alert("Balance যথেষ্ট নেই। Fee সহ Amount আপনার Balance-এর মধ্যে হতে হবে।");

return;

}


try{

await db.collection("withdrawals").add({

uid:me.uid,

name:ud.name,

email:me.email,

method:$("wm").value,

number:n,

amount:a,

fee:fee,

status:"pending",

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

alert(
"Withdrawal request পাঠানো হয়েছে।"
);

wallet();

}catch(e){

alert(e.message);

}

}


/* ==========================================
   WITHDRAW HISTORY
========================================== */

async function hist(){

try{

let s=await db
.collection("withdrawals")
.where("uid","==",me.uid)
.limit(20)
.get();


$("hist").innerHTML=

s.empty
?
"কোনো withdrawal history নেই।"
:
s.docs.map(d=>{

let x=d.data();

return `

<div class="row">

<span>

${money(x.amount)}

<br>

<small>
${esc(x.method)}
•
Fee ${money(x.fee)}
</small>

</span>

<b>
${esc(x.status)}
</b>

</div>

`;

}).join("");

}catch(e){

$("hist").textContent=
"History load করা যাচ্ছে না।";

}

}


/* ==========================================
   TEAM
========================================== */

async function team(){

let c=
ud.referralCode||
me.uid.slice(0,8).toUpperCase();

let n=0;


try{

n=(
await db
.collection("users")
.where("referredBy","==",me.uid)
.get()
).size;

}catch(e){}


$("page").innerHTML=`

<h2>
My Referral Team
</h2>


<div class="card">

<div class="row">

<b>
Referral Code
</b>

<span>
${esc(c)}
</span>

</div>


<button class="btn"
onclick="copyText('${esc(c)}','Referral Code copied')">

Copy Referral Code

</button>


<h3>
Team Size: ${n}
</h3>


${[1,2,3,4].map((x,i)=>`

<div class="row">

<b>
Level ${x}
</b>

<span>
${i===0?n:0}
</span>

<button class="mini">
View
</button>

</div>

`).join("")}


</div>

`;

}

/* ==========================================
   COPY
========================================== */

function copyText(text,message){

navigator.clipboard
.writeText(text)
.then(()=>alert(message))
.catch(()=>alert(text));

}


/* ==========================================
   SAVE PROFILE
========================================== */

async function saveP(){

let n=$("pn").value.trim();


if(!n){

alert("Name দিন।");

return;

}


try{

await db.collection("users")
.doc(me.uid)
.set({

name:n

},{merge:true});


ud.name=n;


if($("pp").value){

let credential=
firebase.auth.EmailAuthProvider.credential(
me.email,
$("pc").value
);

await me.reauthenticateWithCredential(
credential
);

await me.updatePassword(
$("pp").value
);

}


alert("Settings saved successfully.");

profile();

}catch(e){

alert(e.message);

}

}

/* ==========================================
   SAVE ADMIN
========================================== */

async function saveA(){

if(!ADM.includes(me.uid)){

alert("Access denied.");

return;

}


let d={

activationFee:Number($("af").value),

activationBonus:Number($("abn").value),

withdrawalFee:Number($("wf").value),

bkash:$("bk").value.trim(),

nagad:$("ng").value.trim(),

telegram:$("tg").value.trim(),

support1:$("s1").value.trim(),

support2:$("s2").value.trim(),

notice:$("no").value.trim()

};


try{

await db.collection("appData")
.doc("config")
.set(d,{merge:true});


cfg={
...cfg,
...d
};


alert("Settings saved successfully.");

closeM();

home();

}catch(e){

alert(e.message);

}

}


/* ==========================================
   CLOSE MODAL
========================================== */

function closeM(){

$("modal").classList.add("hide");
